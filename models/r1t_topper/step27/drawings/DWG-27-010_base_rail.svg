<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-010_base_rail  BASE RAIL, 6061-T6, 2 OFF (L/R mirror), bonded to the shell foot</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">section y / height............................680 .. 755 x 25</text><text x="18" y="68" font-family="monospace" font-size="11">length (x)....................................-40 .. 1306</text><text x="18" y="82" font-family="monospace" font-size="11">PLF notches (2 per rail)......................82 wide (x), open to the inboard edge, to the strip face u = +16 from the port centre, at (307, +724), (307, -724), (1154, +710), (1154, -710)</text><text x="18" y="96" font-family="monospace" font-size="11">  notch position tol..........................+/-0.2 to datum A (rail inner face) / B (front end); width 78 +0.2/0</text><text x="18" y="110" font-family="monospace" font-size="11">strip (outboard of the notch).................15 mm thick min (front stations)</text><text x="18" y="124" font-family="monospace" font-size="11">rail-screw taps (2 per notch).................M6x1-6H, tap drill 5.0, 11.5 deep, x +/-16, z 31 above the rail underside datum - match-drilled from the PLF body at shop fit-up</text><text x="18" y="138" font-family="monospace" font-size="11">underside (bond face).........................flatness 0.3 over 1,346; masked from anodise, Ra 3.2</text><text x="18" y="152" font-family="monospace" font-size="11">control wells (clear).........................120 x 70 at WELL_GT_L x=60, WELL_GT_R x=60, WELL_TG x=1300</text><text x="18" y="166" font-family="monospace" font-size="11">general tol...................................ISO 2768-mK; break edges 0.3</text><text x="12" y="188" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="202" font-family="monospace" font-size="11">1. Material 6061-T6 (AMS-QQ-A-200/8 bar 80 x 30), CNC; black anodise MIL-A-8625 Type II Class 2 except the bond face. Notch and well x-positions PROVISIONAL until taped (T1-T3, P-CAL-02) and until the port is measured (P-CAL-01b).</text><text x="12" y="224" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>