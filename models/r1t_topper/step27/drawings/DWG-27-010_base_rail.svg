<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-010_base_rail  BASE RAIL, 6061-T6, 2 OFF, with OEM control-well cut-outs</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">section y.....................................680 .. 755 x 25</text><text x="18" y="68" font-family="monospace" font-size="11">port adapter bores............................31 at the 4 Rivian bed ports</text><text x="18" y="82" font-family="monospace" font-size="11">control wells (clear).........................120 x 70 at WELL_GT_L x=60, WELL_GT_R x=60, WELL_TG x=1300</text><text x="12" y="104" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="118" font-family="monospace" font-size="11">1. Well x-positions PROVISIONAL until taped (TAILGATE_CONTROL.md T1-T3); lids not drawn.</text><text x="12" y="140" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>