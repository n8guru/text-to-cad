<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-009_oem_control_well  OEM CONTROL ACCESS WELL, 3 OFF — placeholder outline, see TAILGATE_CONTROL.md</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">clear_l.......................................120.0</text><text x="18" y="68" font-family="monospace" font-size="11">clear_w.......................................70.0</text><text x="18" y="82" font-family="monospace" font-size="11">land_w........................................12.0</text><text x="18" y="96" font-family="monospace" font-size="11">lid_t.........................................4.0</text><text x="18" y="110" font-family="monospace" font-size="11">clear_depth...................................28.0</text><text x="18" y="124" font-family="monospace" font-size="11">drain_slot_w..................................8.0</text><text x="18" y="138" font-family="monospace" font-size="11">drain_slot_h..................................4.0</text><text x="18" y="152" font-family="monospace" font-size="11">lid_open_deg..................................105.0</text><text x="12" y="174" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="188" font-family="monospace" font-size="11">1. Preserves the Gen-1 R1T rail-top buttons the topper base rail covers: tailgate release (which is also the only bed-light toggle) and both Gear Tunnel releases.</text><text x="18" y="202" font-family="monospace" font-size="11">2. MECHANICAL preservation only. No splice, no relocation, no added switch.</text><text x="18" y="216" font-family="monospace" font-size="11">3. Drain discharges OUTBOARD onto the OEM rail cap, outside our seal line.</text><text x="18" y="230" font-family="monospace" font-size="11">4. INCOMPLETE: the well positions depend on tape measurements T1-T5. Rivian publishes no dimensioned button position. The outline shown is a placeholder.</text><text x="12" y="252" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>