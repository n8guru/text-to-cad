<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-002_ledge_rail  LEDGE RAIL, 6061-T6, 4 OFF</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">length........................................500.0</text><text x="18" y="68" font-family="monospace" font-size="11">shelf.........................................50.0 x 8.0</text><text x="18" y="82" font-family="monospace" font-size="11">up-lip........................................8.0 x 18.0</text><text x="18" y="96" font-family="monospace" font-size="11">drain slots...................................2 x 10.0 wide</text><text x="18" y="110" font-family="monospace" font-size="11">lip height to land datum......................+/- 0.1</text><text x="12" y="132" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="146" font-family="monospace" font-size="11">1. This part carries the ENTIRE module weight in shear. The rotary latches carry none.</text><text x="18" y="160" font-family="monospace" font-size="11">2. Lip height is dimensioned FROM THE LAND PLANE, +/- 0.1, not from the extrusion.</text><text x="18" y="174" font-family="monospace" font-size="11">3. Clear anodise. Do not mask the drain slots.</text><text x="12" y="196" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>