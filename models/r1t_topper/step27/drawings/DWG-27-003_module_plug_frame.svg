<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-003_module_plug_frame  MODULE PLUG FRAME, 6061-T6, 4 OFF (common to WINDOW / CAGE / TOOLBOX)</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">flange outer..................................778.0 x 491.0</text><text x="18" y="68" font-family="monospace" font-size="11">flange thickness..............................6.0</text><text x="18" y="82" font-family="monospace" font-size="11">plug clearance per side.......................6.0</text><text x="18" y="96" font-family="monospace" font-size="11">plug depth....................................85.0</text><text x="18" y="110" font-family="monospace" font-size="11">visible shut line.............................4.0</text><text x="18" y="124" font-family="monospace" font-size="11">outer profile tolerance.......................0.3</text><text x="12" y="146" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="160" font-family="monospace" font-size="11">1. ONE frame for all three module variants. That is what makes them interchangeable.</text><text x="18" y="174" font-family="monospace" font-size="11">2. Outer profile 0.3 sets the visible 4 mm shut line.</text><text x="18" y="188" font-family="monospace" font-size="11">3. Striker brackets bolt to the top return; slots give +/-3 fit-up adjustment.</text><text x="12" y="210" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>