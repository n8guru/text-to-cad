<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-003_module_plug_frame  MODULE PLUG FRAME, 6061-T6, 1 PER MODULE (common to WINDOW / CAGE / TOOLBOX)</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">flange, offsets / t...........................-20 .. 44 / 6</text><text x="18" y="68" font-family="monospace" font-size="11">plug tube, offsets / depth....................-11 .. -6 / 85</text><text x="18" y="82" font-family="monospace" font-size="11">visible shut line.............................4.0</text><text x="18" y="96" font-family="monospace" font-size="11">pin bosses....................................Dia 18, seat n = -21.00, Dia 6 H7 press bore</text><text x="18" y="110" font-family="monospace" font-size="11">striker arms..................................u = latch + 20.7 .. 32.7, M10 tapped</text><text x="18" y="124" font-family="monospace" font-size="11">outer profile tolerance.......................0.3</text><text x="12" y="146" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="160" font-family="monospace" font-size="11">1. All socket/hatch border offsets are measured OUTWARD FROM THE APERTURE EDGE and are shared with the module, seal, shell cut and checks (cad/geom.py).</text><text x="18" y="174" font-family="monospace" font-size="11">2. Outer profile sets the visible 4 mm shut line to the frame recess wall.</text><text x="12" y="196" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>