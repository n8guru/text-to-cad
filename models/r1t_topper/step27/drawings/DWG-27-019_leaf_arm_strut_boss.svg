<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-019_leaf_arm_strut_boss  HATCH LEAF STRIKER ARM (2 OFF) + STRUT BOSS (2 OFF), 6061-T6</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">striker arm...................................envelope 12.0 x 26.0 x 44.0, M10x1.5-6H 20 deep</text><text x="18" y="68" font-family="monospace" font-size="11">strut boss....................................22 x 22, M8x1.25-6H 14 deep (Stabilus 4486MD)</text><text x="18" y="82" font-family="monospace" font-size="11">bond..........................................both bonded to the leaf inner skin, DP460, 0.25 bondline</text><text x="18" y="96" font-family="monospace" font-size="11">position......................................+/-0.5 to the hinge axis datum (drives strut geometry)</text><text x="18" y="110" font-family="monospace" font-size="11">finish........................................black anodise MIL-A-8625 Type II Class 2</text><text x="18" y="124" font-family="monospace" font-size="11">general.......................................ISO 2768-mK unless stated; break edges 0.3</text><text x="12" y="146" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="160" font-family="monospace" font-size="11">1. Striker bolt R4-90-321-20 is adjusted +/-3 mm in its slotted bracket (DWG-27-004) before torque.</text><text x="12" y="182" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>