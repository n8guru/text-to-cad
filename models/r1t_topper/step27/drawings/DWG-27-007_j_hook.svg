<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-007_j_hook  J-HOOK, 316 STAINLESS 6 mm, 8 OFF</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">bridge seat...................................v = -93.0 (rests on the frame fin)</text><text x="18" y="68" font-family="monospace" font-size="11">safety catch travel...........................30 mm before the leg meets the fin</text><text x="18" y="82" font-family="monospace" font-size="11">leg drop below fin top........................4 mm (lift 5 to clear)</text><text x="12" y="104" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="118" font-family="monospace" font-size="11">1. Carries the module weight into the fin; the leg is an anti-fall catch, not the pivot.</text><text x="12" y="140" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>