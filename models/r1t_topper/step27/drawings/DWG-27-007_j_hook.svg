<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-007_j_hook  J-HOOK, 316 STAINLESS, 8 OFF</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">material thickness............................6.0</text><text x="18" y="68" font-family="monospace" font-size="11">width.........................................60.0</text><text x="18" y="82" font-family="monospace" font-size="11">throat to pin datum...........................+/- 0.1</text><text x="18" y="96" font-family="monospace" font-size="11">fixing........................................2 x dia 6.8 for M6 A4</text><text x="12" y="118" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="132" font-family="monospace" font-size="11">1. Carries the full module weight into the ledge lip in SHEAR.</text><text x="18" y="146" font-family="monospace" font-size="11">2. Hand calc, not FEA: 29 kg at 3 g = 850 N, 425 N per hook, ~10 MPa shear in the 6 x 30 section. FEA remains a later gate.</text><text x="18" y="160" font-family="monospace" font-size="11">3. Laser cut, press brake, passivate.</text><text x="12" y="182" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>