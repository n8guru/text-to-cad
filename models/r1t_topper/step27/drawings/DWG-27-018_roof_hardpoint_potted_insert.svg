<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-018_roof_hardpoint_potted_insert  ROOF HARDPOINT 6061 M8 (4 OFF) + POTTED INSERT 6061 M4 (26 OFF)</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">hardpoint.....................................Dia 40 x 16, M8x1.25-6H 14 deep, top flush 0/-0.3</text><text x="18" y="68" font-family="monospace" font-size="11">potted insert.................................Dia 10 x 12, flange Dia 14 x 1, M4x0.7-6H thru, knurled OD (straight 0.8 pitch)</text><text x="18" y="82" font-family="monospace" font-size="11">insert installation...........................core-out Dia 12, pot in 3M DP460, flange flush with the inner skin</text><text x="18" y="96" font-family="monospace" font-size="11">finish........................................clear anodise Type II; bond faces masked</text><text x="18" y="110" font-family="monospace" font-size="11">general.......................................ISO 2768-mK unless stated; break edges 0.3</text><text x="12" y="132" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="146" font-family="monospace" font-size="11">1. Hardpoint load is limited to the 24 kg dynamic roof allowance (check_mounting) until FEA.</text><text x="12" y="168" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>