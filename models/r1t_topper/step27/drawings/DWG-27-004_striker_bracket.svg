<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-004_striker_bracket  STRIKER BRACKET, 316, 10 OFF</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">plate.........................................40 x 26 x 6</text><text x="18" y="68" font-family="monospace" font-size="11">striker hole..................................10.6 x 16.6 slot, +/-3 mm fit-up along the closing travel</text><text x="18" y="82" font-family="monospace" font-size="11">mates.........................................Southco R4-90-321-20</text><text x="12" y="104" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="118" font-family="monospace" font-size="11">1. The slot dials the module tolerance stack out at assembly instead of scrapping parts.</text><text x="12" y="140" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>