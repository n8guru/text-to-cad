<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-013_slot_washer_shim  PORT SLOT WASHER 316, 4 OFF + SHIM KIT 316, Dia 36</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">slot washer...................................40 x 36 x 4.0, R6, hole 10.5</text><text x="18" y="68" font-family="monospace" font-size="11">  faces.......................................surface ground, parallel 0.03 (Nord-Lock needs a hard flat seat)</text><text x="18" y="82" font-family="monospace" font-size="11">shims.........................................Dia 36 / 10.5: 0.5 x 8 (2 per station nominal) + fit-up kit 0.5 x 8, 1.0 x 4</text><text x="18" y="96" font-family="monospace" font-size="11">  thickness tol...............................+/-0.02 (precision shim stock)</text><text x="18" y="110" font-family="monospace" font-size="11">finish........................................laser cut, deburr, passivate ASTM A967</text><text x="12" y="132" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="146" font-family="monospace" font-size="11">1. Washer lands >= 8.75 mm on the rail all round the +/-6 x +/-2.75 obround float.</text><text x="12" y="168" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>