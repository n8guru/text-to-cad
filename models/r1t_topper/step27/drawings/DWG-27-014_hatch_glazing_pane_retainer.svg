<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-014_hatch_glazing_pane_retainer  HATCH GLAZING PANE (PC) + RETAINER (6061), 2 + 2 OFF (L/R mirror)</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">pane envelope.................................362.0 x 210.0 x 5.0</text><text x="18" y="68" font-family="monospace" font-size="11">pane..........................................5 mm hard-coat PC (Makrolon AR / Lexan Margard MR10)</text><text x="18" y="82" font-family="monospace" font-size="11">pane profile tol..............................+/-0.5; edges routed + flame-free polish</text><text x="18" y="96" font-family="monospace" font-size="11">retainer envelope.............................362.0 x 210.0 x 5.0</text><text x="18" y="110" font-family="monospace" font-size="11">retainer......................................6061-T6 5 mm plate, CNC; black anodise MIL-A-8625 Type II Class 2</text><text x="18" y="124" font-family="monospace" font-size="11">retainer screws...............................M4 at <= 90 mm pitch into potted inserts (DWG-27-018)</text><text x="18" y="138" font-family="monospace" font-size="11">general.......................................ISO 2768-mK unless stated; break edges 0.3</text><text x="12" y="160" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="174" font-family="monospace" font-size="11">1. Pane is inside-glazed behind the 3 mm carbon lip; 1 mm EPDM glazing gasket each face; 1.2 Nm on the retainer screws (clamp, do not crush).</text><text x="12" y="196" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>