<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-006_compression_limiter  COMPRESSION LIMITER PAD, UHMW-PE, 12 OFF</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">pad l x w.....................................30 x 20</text><text x="18" y="68" font-family="monospace" font-size="11">THICKNESS.....................................7.40 +0 / -0.05</text><text x="18" y="82" font-family="monospace" font-size="11">clearance hole................................dia 6.6</text><text x="18" y="96" font-family="monospace" font-size="11">stack.........................................sits on a 12.85 frame boss: boss + pad = the seal's compressed height</text><text x="12" y="118" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="132" font-family="monospace" font-size="11">1. The previous pad sat 12.85 mm short of the flange and stopped nothing; the boss fixes that.</text><text x="12" y="154" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>