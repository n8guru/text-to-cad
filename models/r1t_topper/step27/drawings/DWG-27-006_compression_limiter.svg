<text x="12" y="20" font-family="monospace" font-size="15" font-weight="bold">DWG-27-006_compression_limiter  COMPRESSION LIMITER, UHMW-PE, 12 OFF</text><text x="12" y="40" font-family="monospace" font-size="11">DIMENSIONS (mm) — all from step27/hardware.json + blender/params.json</text><text x="18" y="54" font-family="monospace" font-size="11">pad...........................................30.0 x 20.0</text><text x="18" y="68" font-family="monospace" font-size="11">THICKNESS.....................................7.40 +0 / -0.05</text><text x="18" y="82" font-family="monospace" font-size="11">clearance hole................................dia 6.6</text><text x="18" y="96" font-family="monospace" font-size="11">stock.........................................3/8 in (9.5 mm) UHMW sheet, machined to 7.40 mm</text><text x="12" y="118" font-family="monospace" font-size="11" font-weight="bold">NOTES</text><text x="18" y="132" font-family="monospace" font-size="11">1. The thickness IS the seal compression. It sets the Trim-Lok DD6139 bulb to its designed 33 % deflection and stops the bulb being crushed.</text><text x="18" y="146" font-family="monospace" font-size="11">2. Waterjet the blank, then surface grind to thickness. Do not rely on sheet tolerance.</text><text x="18" y="160" font-family="monospace" font-size="11">3. Virgin natural UHMW. No regrind, no filler.</text><text x="12" y="182" font-family="monospace" font-size="10" fill="#a00">NOT RELEASED FOR FABRICATION. Uncalibrated against the physical vehicle. No FEA performed.</text></svg>